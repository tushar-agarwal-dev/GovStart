# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/yuktisetu
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.govstart=DEBUG

# JWT Configurations (demo keys, should be secure in prod)
yuktisetu.jwt.secret=9a4f2c8d3e1b7f0a5c8d3e1b7f0a5c8d3e1b7f0a5c8d3e1b7f0a5c8d3e1b7f0a
yuktisetu.jwt.expiration-ms=86400000

# Gemini API Configurations
yuktisetu.gemini.api-key=${GEMINI_API_KEY:}
yuktisetu.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
